name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#e100ff&color_dots=#ebedf0,#d8b4fe,#c084fc,#9333ea,#6b21a8
            dist/snake-dark.svg?palette=github-dark&color_snake=#e100ff&color_dots=#161b22,#3b0764,#6b21a8,#9333ea,#c77dff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
