<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a1f"/>
      <stop offset="1" stop-color="#160b33"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f00ff"/>
      <stop offset="1" stop-color="#e100ff"/>
    </linearGradient>
    <linearGradient id="fill2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#7f00ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .h { font: 800 15px 'Segoe UI', Arial, sans-serif; fill: #c77dff; letter-spacing: 3px; }
    .l { font: 600 13px 'Consolas', 'Courier New', monospace; fill: #e0d7ff; }
    .v { font: 700 12px 'Consolas', 'Courier New', monospace; fill: #8b7fb8; }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 1.6s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes grow { from { transform: scaleX(0); } }
    .shine { animation: sweep 3.2s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-120px); } 60%, 100% { transform: translateX(420px); } }
    .dot { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
    .eq rect { transform-box: fill-box; transform-origin: bottom; animation: eq 1.1s ease-in-out infinite; }
    @keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
  </style>

  <rect x="1" y="1" width="858" height="298" rx="16" fill="url(#bg)" stroke="#2a1f4a"/>

  <!-- left: languages -->
  <circle class="dot" cx="30" cy="34" r="5" fill="#e100ff"/>
  <text class="h" x="44" y="39">LANGUAGES</text>
  <g transform="translate(30,62)">
    <g><text class="l" y="12">TypeScript</text><rect x="110" y="2" width="260" height="12" rx="6" fill="#211a3d"/><rect class="bar" x="110" y="2" width="244" height="12" rx="6" fill="url(#fill)" style="animation-delay:.1s"/><text class="v" x="380" y="13">94%</text></g>
    <g transform="translate(0,34)"><text class="l" y="12">JavaScript</text><rect x="110" y="2" width="260" height="12" rx="6" fill="#211a3d"/><rect class="bar" x="110" y="2" width="221" height="12" rx="6" fill="url(#fill)" style="animation-delay:.25s"/><text class="v" x="380" y="13">85%</text></g>
    <g transform="translate(0,68)"><text class="l" y="12">HTML/CSS</text><rect x="110" y="2" width="260" height="12" rx="6" fill="#211a3d"/><rect class="bar" x="110" y="2" width="234" height="12" rx="6" fill="url(#fill)" style="animation-delay:.4s"/><text class="v" x="380" y="13">90%</text></g>
    <g transform="translate(0,102)"><text class="l" y="12">Prompting</text><rect x="110" y="2" width="260" height="12" rx="6" fill="#211a3d"/><rect class="bar" x="110" y="2" width="255" height="12" rx="6" fill="url(#fill)" style="animation-delay:.55s"/><text class="v" x="380" y="13">98%</text></g>
    <g transform="translate(0,136)"><text class="l" y="12">Python</text><rect x="110" y="2" width="260" height="12" rx="6" fill="#211a3d"/><rect class="bar" x="110" y="2" width="143" height="12" rx="6" fill="url(#fill)" style="animation-delay:.7s"/><text class="v" x="380" y="13">55%</text></g>
    <g transform="translate(0,170)"><text class="l" y="12">SQL</text><rect x="110" y="2" width="260" height="12" rx="6" fill="#211a3d"/><rect class="bar" x="110" y="2" width="156" height="12" rx="6" fill="url(#fill)" style="animation-delay:.85s"/><text class="v" x="380" y="13">60%</text></g>
    <rect class="shine" x="110" y="0" width="80" height="190" fill="url(#shine)" opacity=".5"/>
  </g>

  <line x1="440" y1="30" x2="440" y2="270" stroke="#2a1f4a"/>

  <!-- right: vibe meters -->
  <circle class="dot" cx="470" cy="34" r="5" fill="#00d4ff" style="animation-delay:.8s"/>
  <text class="h" x="484" y="39" style="fill:#7dd3fc">VIBE METERS</text>
  <g transform="translate(470,62)">
    <g><text class="l" y="12">AI agents</text><rect x="120" y="2" width="220" height="12" rx="6" fill="#211a3d"/><rect class="bar" x="120" y="2" width="209" height="12" rx="6" fill="url(#fill2)" style="animation-delay:.2s"/></g>
    <g transform="translate(0,34)"><text class="l" y="12">Realtime/WS</text><rect x="120" y="2" width="220" height="12" rx="6" fill="#211a3d"/><rect class="bar" x="120" y="2" width="176" height="12" rx="6" fill="url(#fill2)" style="animation-delay:.35s"/></g>
    <g transform="translate(0,68)"><text class="l" y="12">UI / motion</text><rect x="120" y="2" width="220" height="12" rx="6" fill="#211a3d"/><rect class="bar" x="120" y="2" width="200" height="12" rx="6" fill="url(#fill2)" style="animation-delay:.5s"/></g>
    <g transform="translate(0,102)"><text class="l" y="12">Shipping</text><rect x="120" y="2" width="220" height="12" rx="6" fill="#211a3d"/><rect class="bar" x="120" y="2" width="216" height="12" rx="6" fill="url(#fill2)" style="animation-delay:.65s"/></g>
    <g transform="translate(0,136)"><text class="l" y="12">Sleep</text><rect x="120" y="2" width="220" height="12" rx="6" fill="#211a3d"/><rect class="bar" x="120" y="2" width="35" height="12" rx="6" fill="#ff4fa3" style="animation-delay:.8s"/></g>
  </g>

  <!-- equalizer -->
  <g class="eq" transform="translate(470,236)" fill="#c77dff">
    <rect x="0" y="0" width="6" height="24" rx="2"/>
    <rect x="10" y="0" width="6" height="24" rx="2" style="animation-delay:-.3s"/>
    <rect x="20" y="0" width="6" height="24" rx="2" style="animation-delay:-.6s"/>
    <rect x="30" y="0" width="6" height="24" rx="2" style="animation-delay:-.15s"/>
    <rect x="40" y="0" width="6" height="24" rx="2" style="animation-delay:-.45s"/>
  </g>
  <text class="v" x="526" y="255">now playing: lofi beats while shipping</text>
</svg>
